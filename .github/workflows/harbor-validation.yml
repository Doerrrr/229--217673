name: Harbor 0.5.0 validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  oracle-and-nop:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Oracle trial
        run: uvx --python 3.12 --from harbor==0.5.0 harbor trials start -p . -a oracle --trial-name oracle --trials-dir .trials/oracle
      - name: NOP trial
        run: uvx --python 3.12 --from harbor==0.5.0 harbor trials start -p . -a nop --trial-name nop --trials-dir .trials/nop
      - name: Check rewards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name, expected in (("oracle", 1.0), ("nop", 0.0)):
              path = Path(".trials") / name / name / "result.json"
              result = json.loads(path.read_text(encoding="utf-8"))
              if result.get("exception_info"):
                  raise SystemExit(f"{name} trial failed: {result['exception_info']}")
              rewards = (result.get("verifier_result") or {}).get("rewards") or {}
              actual = rewards.get("reward")
              print(f"{name}: reward={actual}")
              if actual != expected:
                  raise SystemExit(f"{name} expected {expected}, got {actual}")
          PY
      - name: Upload trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-trials
          path: .trials
          if-no-files-found: ignore
